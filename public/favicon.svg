<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ab-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.95" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.85" />
    </linearGradient>
    <filter id="ab-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#ab-grad)" filter="url(#ab-glow)" />
  <text
    x="32"
    y="33"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
    font-weight="700"
    font-size="26"
    letter-spacing="0.5"
    fill="#0a0a1a"
  >AB</text>
</svg>
